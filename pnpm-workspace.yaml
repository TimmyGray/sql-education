packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  better-sqlite3: true
  prisma: true
  sharp: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - argon2
  - better-sqlite3
  - esbuild
  - sharp
  - "@scarf/scarf"
